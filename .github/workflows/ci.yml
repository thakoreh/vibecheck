name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.13"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" build

      - name: Run tests
        run: pytest -v

      - name: VibeCheck self-scan
        run: python -m vibecheck.cli scan vibecheck/ --no-security

      - name: Build distributions and test installed wheel
        shell: bash
        run: |
          python -m build
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python tests/package_smoke.py

      - name: Test source distribution consumer
        shell: bash
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.tar.gz
          python tests/package_smoke.py
